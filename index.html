<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acceso - Control de Atenciones</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white w-full max-w-md rounded-2xl shadow-lg p-8 border border-slate-200">
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-teal-100 text-teal-700 text-3xl mb-3">
        🏡
      </div>
      <h1 class="text-2xl font-bold text-slate-800">Casa de Reposo</h1>
      <p class="text-sm text-slate-500 mt-1">Sistema de Registro de Servicios y Talleres</p>
    </div>

    <form id="login-form" class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Correo electrónico</label>
        <input type="email" id="email" required placeholder="usuario@casareposo.pe"
          class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none transition" />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Contraseña</label>
        <input type="password" id="password" required placeholder="••••••••"
          class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-teal-500 focus:border-teal-500 outline-none transition" />
      </div>

      <div id="error-msg" class="hidden bg-red-50 text-red-600 text-sm p-3 rounded-xl border border-red-200">
        Credenciales incorrectas. Verifica tu correo y contraseña.
      </div>

      <button type="submit" id="btn-login"
        class="w-full bg-teal-600 hover:bg-teal-700 text-white font-semibold py-3.5 rounded-xl shadow-md transition active:scale-[0.99]">
        Ingresar al Sistema
      </button>
    </form>
  </div>

  <script src="js/supabase-client.js"></script>
  <script>
    // Si ya hay sesión activa, pasar directo al registro
    (async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) window.location.href = 'registro.html';
    })();

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btn-login');
      const errorBox = document.getElementById('error-msg');
      
      btn.disabled = true;
      btn.textContent = 'Verificando...';
      errorBox.classList.add('hidden');

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) {
        errorBox.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Ingresar al Sistema';
      } else {
        window.location.href = 'registro.html';
      }
    });
  </script>
</body>
</html>
